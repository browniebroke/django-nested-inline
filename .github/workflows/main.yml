name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  linting:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-assertive flake8-bugbear isort

      - name: flake8
        run: |
          flake8

      - name: isort
        run: |
          isort . --check-only --diff

  build:
    runs-on: ubuntu-20.04

    strategy:
      fail-fast: false
      matrix:
        tox_env:
          - "py36-django111"
          - "py36-django20"
          - "py36-django21"
          - "py36-django22"
          - "py36-django30"
          - "py36-django32"

          - "py37-django111"
          - "py37-django20"
          - "py37-django21"
          - "py37-django22"
          - "py37-django30"
          - "py37-django32"

          - "py38-django20"
          - "py38-django21"
          - "py38-django22"
          - "py38-django30"
          - "py38-django32"
          - "py38-django40"
          - "py38-django41"

          - "py39-django30"
          - "py39-django32"
          - "py39-django40"
          - "py39-django41"

          - "py310-django32"
          - "py310-django40"
          - "py310-django41"
          - "py310-django42"
          - "py310-django50"
          - "py310-django51"
          - "py310-django52"

          - "py311-django41"
          - "py311-django42"
          - "py311-django50"
          - "py311-django51"
          - "py311-django52"

          - "py312-django42"
          - "py312-django50"
          - "py312-django51"
          - "py312-django52"

          - "py313-django51"
          - "py313-django52"

        include:
          - python: "3.6"
            tox_env: "py36-django111"
          - python: "3.6"
            tox_env: "py36-django20"
          - python: "3.6"
            tox_env: "py36-django21"
          - python: "3.6"
            tox_env: "py36-django22"
          - python: "3.6"
            tox_env: "py36-django30"
          - python: "3.6"
            tox_env: "py36-django32"

          - python: "3.7"
            tox_env: "py37-django111"
          - python: "3.7"
            tox_env: "py37-django20"
          - python: "3.7"
            tox_env: "py37-django21"
          - python: "3.7"
            tox_env: "py37-django22"
          - python: "3.7"
            tox_env: "py37-django30"
          - python: "3.7"
            tox_env: "py37-django32"

          - python: "3.8"
            tox_env: "py38-django20"
          - python: "3.8"
            tox_env: "py38-django21"
          - python: "3.8"
            tox_env: "py38-django22"
          - python: "3.8"
            tox_env: "py38-django30"
          - python: "3.8"
            tox_env: "py38-django32"
          - python: "3.8"
            tox_env: "py38-django40"
          - python: "3.8"
            tox_env: "py38-django41"

          - python: "3.9"
            tox_env: "py39-django30"
          - python: "3.9"
            tox_env: "py39-django32"
          - python: "3.9"
            tox_env: "py39-django40"
          - python: "3.9"
            tox_env: "py39-django41"

          - python: "3.10"
            tox_env: "py310-django32"
          - python: "3.10"
            tox_env: "py310-django40"
          - python: "3.10"
            tox_env: "py310-django41"
          - python: "3.10"
            tox_env: "py310-django42"
          - python: "3.10"
            tox_env: "py310-django50"
          - python: "3.10"
            tox_env: "py310-django51"
          - python: "3.10"
            tox_env: "py310-django52"

          - python: "3.11"
            tox_env: "py311-django41"
          - python: "3.11"
            tox_env: "py311-django42"
          - python: "3.11"
            tox_env: "py311-django50"
          - python: "3.11"
            tox_env: "py311-django51"
          - python: "3.11"
            tox_env: "py311-django52"

          - python: "3.12"
            tox_env: "py312-django42"
          - python: "3.12"
            tox_env: "py312-django50"
          - python: "3.12"
            tox_env: "py312-django51"
          - python: "3.12"
            tox_env: "py312-django52"

          - python: "3.13"
            tox_env: "py313-django51"
          - python: "3.13"
            tox_env: "py313-django52"


    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade wheel setuptools
          pip install distlib tox

      - name: Test
        run: |
          tox -e ${{ matrix.tox_env }}
